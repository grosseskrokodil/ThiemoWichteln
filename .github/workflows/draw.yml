name: Jahrgang auslosen
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: wichteln-pages
  cancel-in-progress: false
jobs:
  draw:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Einmal auslosen und speichern
        run: python scripts/wichteln.py draw
      - name: Jahresergebnis versionieren
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/years site/data.js
          git commit -m 'Jahresauslosung speichern'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Webseite veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v4
